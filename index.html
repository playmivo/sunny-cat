  <style>
:root {
  color-scheme: light;
  --paper: #f6f2e9;
  --ink: #382f28;
  --line: #d4c8b7;
  --focus: #734731;

  background: var(--paper);
  color: var(--ink);
}

* { box-sizing: border-box; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 12px 16px;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.viewer {
  display: grid;
  gap: 10px;
  width: min(100%, 1160px, calc((100vh - 126px) * 1.6));
  width: min(100%, 1160px, calc((100dvh - 126px) * 1.6));
  min-width: 0;
}
.scene {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-width: 0;
  aspect-ratio: 8 / 5;
  border-radius: 14px;
  background: #cfbfa3;
  box-shadow: 0 1px 2px #49372518, 0 4px 14px #49372512;
}
#stage, .pet-target {
  position: absolute;
  display: block;
  width: 100%;
  height: 100%;
  inset: 0;
}
.pet-target {
  appearance: none;
  padding: 0;
  border: 0;
  border-radius: inherit;
  background: transparent;
  touch-action: pinch-zoom;
  -webkit-tap-highlight-color: transparent;
}
.pet-target.is-following { cursor: none; }
.pet-target:focus-visible {
  outline-offset: -5px;
  outline-color: #432b22;
}
.asset-status {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  padding: 12px;
  pointer-events: none;
}
.asset-status[hidden] { display: none; }
.asset-notice {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 4px 12px;
  padding: 4px 12px;
  border-radius: 10px;
  background: #f6f2e9ee;
  color: var(--ink);
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
}
.asset-notice p { margin: 5px 0; }
#asset-retry {
  min-height: 40px;
  border: 0;
  border-radius: 5px;
  padding: 0 6px;
  background: transparent;
  color: var(--focus);
  font-weight: 600;
  cursor: pointer;
  pointer-events: auto;
}

.controls {
  display: flex;
  min-width: 0;
  min-height: 48px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.choices, .options {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 10px;
}
.choices {
  padding: 6px;
  margin: -6px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.options { flex: 0 0 auto; }
.options:empty { min-height: 47px; }
.backgrounds {
  flex-shrink: 1;
  margin: -6px -6px -6px 3px;
  padding: 6px 6px 6px 12px;
  background: linear-gradient(var(--line), var(--line)) left center / 1px 27px no-repeat;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scroll-padding-inline: 12px 6px;
  scrollbar-width: thin;
}
.option {
  display: block;
  flex: 0 0 auto;
  width: 47px;
  height: 47px;
  border: 1px solid #a3896d56;
  border-radius: 11px;
  background: #dfc3a2;
  overflow: hidden;
  padding: 0;
  cursor: pointer;
}
.option:hover { outline: 1px solid #8f745b; outline-offset: 2px; }
.option[aria-pressed="true"] { outline: 1.5px solid #5f4434; outline-offset: 2px; }
.option:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
.option img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cats img { object-position: 14% 42%; }
.size-controls {
  display: grid;
  flex: 0 1 220px;
  min-width: 144px;
  gap: 4px;
  color: var(--focus);
}
.size-control {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) 24px;
  min-height: 44px;
  align-items: center;
  gap: 9px;
}
.size-control svg {
  display: block;
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.size-control svg path[fill] { stroke: none; }
.size-control svg path[transform] { vector-effect: non-scaling-stroke; }
.size-control input {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  accent-color: var(--focus);
}
.size-control input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
  border: 0;
}

@media (max-width: 620px), (max-width: 1024px) and (max-height: 550px) and (pointer: coarse) {
  body { padding: 9px 10px; }
  .viewer { width: 100%; gap: 9px; }
  .scene { aspect-ratio: 3 / 2; border-radius: 12px; }
  .controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }
  .choices { display: contents; }
  .size-controls { min-width: 0; }
  .options {
    margin: -4px;
    padding: 4px;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scrollbar-width: thin;
  }
  .backgrounds {
    gap: 6px;
    margin: -6px;
    padding: 6px;
    background: none;
    scroll-padding-inline: 6px;
  }
}

@media (max-width: 1024px) and (max-height: 550px) and (orientation: landscape) and (pointer: coarse) {
  .viewer { width: min(100%, calc((100svh - 40px) * 1.5)); }
}

  <script>
    (() => {

        if (status.dataset.appReady) return;
        document.getElementById("asset-status-text").textContent = "场景暂时无法加载";

      window.setTimeout(showLoadFailure, 12000);
      document.querySelector('script[type="module"][src]')?.addEventListener("error", showLoadFailure);
      retry.addEventListener("click", () => {
        if (!status.dataset.appReady) window.location.reload();

<script>

const { cats, backgrounds, hands } = (() => {

const { catGeometry, closestBodyContact, drawCat, hitCat, tailEdgeDistance, tailJointAngles, tailPointAt, tailSpine, tailSurfacePoint } = (() => {
const bodyMasks = new WeakMap();
const bodyShadows = new WeakMap();
const shapedBodies = new WeakMap();
const blendedBodies = new WeakMap();
const shadedTails = new WeakMap();
const TAIL_SEGMENTS = 24;
const TAIL_SOCKET_LINKS = 2;
const TAIL_STEERING_PASSES = 5;
const TAIL_STEERING_LIMIT = 1.12;
const BODY_SHAPE_COLUMNS = 24;
const BODY_COLUMNS = 12;
const BODY_ROWS = 6;

const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
const mix = (from, to, amount) => from + (to - from) * amount;
const imageWidth = (image) => image?.naturalWidth ?? image?.width ?? 0;
const imageHeight = (image) => image?.naturalHeight ?? image?.height ?? 0;
const ready = (image) => image && image.complete !== false && imageWidth(image) > 0 && imageHeight(image) > 0;

function catGeometry(cat = {}, art = {}, bodySize = 0) {
  const settings = cat.geometry ?? {};
  const body = art?.body;
  const bodyWidth = settings.bodyWidth ?? 710;
  const baseHeight = settings.bodyHeight ?? (ready(body) ? bodyWidth * imageHeight(body) / imageWidth(body) : 328);
  const bodyX = settings.bodyX ?? 138;
  const baseY = settings.bodyY ?? 369 - baseHeight / 2;
  const rootU = settings.rootU ?? 0.935;
  const rootV = settings.rootV ?? 0.526;
  const headU = settings.headU ?? 0.14;
  const headEndU = settings.headEndU ?? 0.28;
  const backU = settings.backU ?? 0.69;
  const rootX = bodyX + bodyWidth * rootU;
  const rootY = baseY + baseHeight * rootV;
  const torsoChange = clamp(bodySize, -1, 1) * 0.24;
  const extraHeight = Math.max(0, torsoChange) * baseHeight;
  const bodyY = baseY - extraHeight * rootV;
  const bodyHeight = baseHeight + extraHeight;
  const tailLength = settings.tailLength ?? 332;
  const shape = { baseHeight, rootY, rootU, rootV, headEndU, torsoChange };

  return {
    ...shape, bodyX, bodyY, bodyWidth, bodyHeight, rootX, tailLength,
    tailWidth: settings.tailWidth ?? 100,
    tailCenterV: settings.tailCenterV ?? 0.525,
    tailRootShade: settings.tailRootShade ?? ['#5b331a60', '#5b331a4f', '#5b331a00'],
    headX: bodyX + bodyWidth * headU,
    headY: bodyYAt(shape, headU, settings.headV ?? 0.47),
    headEndX: bodyX + bodyWidth * headEndU,
    backX: bodyX + bodyWidth * backU,
    backY: bodyYAt(shape, backU, settings.backV ?? 0.51),
  };
}

function torsoScale(geometry, u) {
  if (!geometry.torsoChange) return 1;
  const shoulder = clamp((u - geometry.headEndU) / 0.27);
  const rump = clamp((geometry.rootU - u) / 0.25);
  return 1 + geometry.torsoChange * shoulder ** 2 * (3 - 2 * shoulder) * rump ** 2 * (3 - 2 * rump);
}

function bodyYAt(geometry, u, v) {
  return geometry.rootY + (v - geometry.rootV) * geometry.baseHeight * torsoScale(geometry, u);
}

function tailPointAt(spine, progress) {
  const position = clamp(progress) * TAIL_SEGMENTS;
  const segment = Math.min(TAIL_SEGMENTS - 1, Math.floor(position));
  const before = spine[segment];
  const after = spine[segment + 1];
  const part = position - segment;
  return {
    x: mix(before.x, after.x, part),
    y: mix(before.y, after.y, part),
    angle: Math.atan2(after.y - before.y, after.x - before.x),
  };
}

function tailSurfacePoint(x, y, spine, start = 0, end = 1) {
  const lower = start * TAIL_SEGMENTS;
  const upper = end * TAIL_SEGMENTS;
  let contact = { progress: start, distance: Infinity };
  for (let index = Math.floor(lower); index < Math.ceil(upper); index += 1) {
    const before = spine[index];
    const after = spine[index + 1];
    const dx = after.x - before.x;
    const dy = after.y - before.y;
    const projection = ((x - before.x) * dx + (y - before.y) * dy) / (dx * dx + dy * dy);
    const part = clamp(projection, Math.max(0, lower - index), Math.min(1, upper - index));
    const distance = Math.hypot(x - before.x - dx * part, y - before.y - dy * part);
    if (distance < contact.distance) {
      const widthScale = mix(before.widthScale ?? 1, after.widthScale ?? 1, part);
      contact = { progress: (index + part) / TAIL_SEGMENTS, distance, widthScale };
    }
  }
  return contact;
}

function tailEdgeDistance(geometry, contact) {
  return contact.distance - tailRadius(geometry, contact.progress) * (contact.widthScale ?? 1);
}

function tailJointAngles(spine) {
  const angles = [];
  let previous = 0;
  for (let index = 0; index < TAIL_SEGMENTS; index += 1) {
    const before = spine[index];
    const after = spine[index + 1];
    const angle = Math.atan2(after.y - before.y, after.x - before.x);
    previous = angle + 2 * Math.PI * Math.round((previous - angle) / (2 * Math.PI));
    angles.push(previous);
  }
  return angles;
}

function drawCat(ctx, pose = {}, cat = {}, art = {}, spine, geometry = catGeometry(cat, art)) {
  if (!ready(art?.body)) return;

  const hasTail = ready(art.tail);
  const artwork = hasTail ? blendTailRoot(art.body, geometry) : art.body;
  const body = fitBodyShape(artwork, geometry);
  const motion = bodyMotion(geometry, pose);
  drawBodyShadow(ctx, geometry.torsoChange ? body : art.body, geometry, motion);
  if (hasTail) {
    const tail = spine ?? tailSpine(geometry, pose);
    drawTailShadow(ctx, geometry, tail);
    drawTail(ctx, shadeTail(art.tail, geometry), geometry, tail);
  }
  drawBody(ctx, body, geometry, motion);
}

function hitCat(x, y, pose = {}, cat = {}, art = {}, spine, geometry = catGeometry(cat, art)) {
  if (!ready(art?.body)) return null;
  const onBody = bodyContains(art.body, geometry, x, y);

  if (onBody) return x <= geometry.headEndX ? 'head' : 'back';
  if (!ready(art.tail)) return null;

  const contact = tailSurfacePoint(x, y, spine ?? tailSpine(geometry, pose));
  return tailEdgeDistance(geometry, contact) <= 7 ? 'tail' : null;
}

function tailSpine(geometry, pose = {}) {
  const { rootX, rootY, tailLength } = geometry;
  const grip = pose.tailProgress ?? 0;
  const pressure = clamp(pose.tailPressure ?? 0);
  const length = tailLength / TAIL_SEGMENTS;
  const spine = [{ x: rootX, y: rootY }];
  const bounds = pose.tailTarget?.bounds ?? pose.tailBounds;
  const angles = pose.tailAngles ?? defaultTailAngles(pose);
  placeTailLinks(spine, length, angles);
  if ((pose.tailAngles || bounds) && !tailFits(geometry, spine, bounds)) {
    constrainTail(geometry, spine, defaultTailAngles({}), angles, bounds);
  }

  if (pose.tailTarget) {
    const before = tailJointAngles(spine);
    steerTail(spine, pose.tailTarget);
    if (!tailFits(geometry, spine, bounds)) {
      constrainTail(geometry, spine, before, tailJointAngles(spine), bounds);
    }
  }

  for (let index = 0; index < spine.length; index += 1) {
    const before = spine[Math.max(index - 1, 0)];
    const after = spine[Math.min(index + 1, spine.length - 1)];
    const dx = after.x - before.x;
    const dy = after.y - before.y;
    const distance = Math.max(0.0001, Math.hypot(dx, dy));
    spine[index].nx = -dy / distance;
    spine[index].ny = dx / distance;
    const contact = (index / TAIL_SEGMENTS - grip) / 0.09;
    spine[index].widthScale = 1 - pressure * 0.11 * Math.exp(-contact * contact) * clamp(index / 3);
  }
  return spine;
}

function defaultTailAngles(pose) {
  const open = clamp(pose.tailOpen ?? 0);
  const bend = pose.tailBend ?? 0;
  const grip = pose.tailProgress ?? 0;
  const flex = pose.tailFlex ?? 0;

  return Array.from({ length: TAIL_SEGMENTS }, (_, index) => {
    const progress = (index + 0.5) / TAIL_SEGMENTS;
    const curl = Math.PI * clamp((progress - 0.31) / 0.69) ** 1.12;
    const fromRoot = clamp((progress - 0.04) / 0.59);
    const lifted = bend * fromRoot * (2 - fromRoot);
    const softTip = 0.27 * clamp((progress - 0.63) / 0.37) ** 2;
    const local = (progress - grip) / 0.16;
    const flexWeight = Math.exp(-local * local) * clamp(progress * 8);
    return mix(curl, lifted + softTip, open) + flex * flexWeight;
  });
}

function placeTailLinks(spine, length, angles) {
  for (let index = 0; index < TAIL_SEGMENTS; index += 1) {
    const angle = index < TAIL_SOCKET_LINKS ? 0 : angles[index];
    const previous = spine[index];
    const next = spine[index + 1] ?? {};
    next.x = previous.x + Math.cos(angle) * length;
    next.y = previous.y + Math.sin(angle) * length;
    spine[index + 1] = next;
  }
}

function tailFits(geometry, spine, bounds = {}) {
  const { left = -Infinity, right = Infinity, top = -Infinity, bottom = Infinity } = bounds;
  const bodyLimit = geometry.rootX - geometry.tailWidth * 0.12;
  for (let index = 0; index < spine.length; index += 1) {
    const { x, y } = spine[index];
    const progress = index / TAIL_SEGMENTS;
    const minX = progress >= 0.25 ? Math.max(left, bodyLimit) : left;
    const radius = tailRadius(geometry, progress);
    if (x - radius < minX || x + radius > right || y - radius < top || y + radius > bottom) return false;
  }
  return true;
}

function constrainTail(geometry, spine, from, to, bounds) {
  const length = geometry.tailLength / TAIL_SEGMENTS;
  const angles = new Array(TAIL_SEGMENTS);
  let minimum = 0;

const assetStatus = document.querySelector("#asset-status");
const assetStatusText = document.querySelector("#asset-status-text");
const assetRetry = document.querySelector("#asset-retry");
const context = canvas.getContext("2d");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const mobileLayout = window.matchMedia("(max-width: 620px), (max-width: 1024px) and (max-height: 550px) and (pointer: coarse)");
const purr = new Purr();
const images = new Map();
const view = {
  width: 0, height: 0, pixelRatio: 1, scale: 1, x: 0, y: 0, mobile: false,
  catScale: 1, catX: 0, catY: 0,
};

let cat = readSelection("cat", cats);
let background = readSelection("background", backgrounds);
let art = loadCat(cat);
let bodySize = 0;
let geometry = catGeometry(cat, art, bodySize);
let keyboard = null;
let pointerId = null;
let touchStartedAt = null;
let touchTailJoined = false;
let directBodyFollow = false;
let gesture = null;
let previousTime = 0;
let animation = 0;
let intensity = 0;
let tailRecovery = null;
let tailDisplacement = null;
let passedTail = null;
let sceneLoadTimeout;

const pose = {
  head: 0,
  back: 0,
  tailOpen: 0,
  tailBend: 0,
  tailProgress: 0,
  tailFlex: 0,
  tailPressure: 0,
  contactX: geometry.backX,
  contactY: geometry.backY,
  bodyContactX: geometry.backX,
  bodyContactY: geometry.backY,
  strokeX: 0,
  strokeY: 0,
};
const hand = { x: pose.contactX, y: pose.contactY, grip: 0, tilt: 0, visible: false, entry: 1 };
let spine = tailSpine(geometry, pose);

function imageFor(url, priority = "auto", retry = false) {
  if (!url) return null;
  if (retry || !images.has(url)) {
    const image = new Image();
    image.decoding = "async";
    image.fetchPriority = priority;
    image.src = retry && !url.startsWith("data:")
      ? url + (url.includes("?") ? "&" : "?") + "retry=" + Date.now()
      : url;
    images.set(url, image);
  }
  return images.get(url);
}

function backgroundImage(item) {
  return (mobileLayout.matches && item.compactImage) || item.image;
}

function loadCat(item, retry = false) {
  return { body: imageFor(item.body, "high", retry), tail: null };
}

function ready(image) {
  return image?.complete && image.naturalWidth > 0;
}

function watchSceneAssets() {
  clearTimeout(sceneLoadTimeout);
  const current = art;
  const body = current.body;
  target.disabled = true;
  assetStatus.hidden = false;
  assetStatusText.textContent = "正在加载场景…";
  assetRetry.hidden = true;

  const showFailure = (message) => {
    if (art !== current) return;
    clearTimeout(sceneLoadTimeout);
    assetStatusText.textContent = message;
    assetRetry.hidden = false;
  };
  const showCat = () => {
    if (art !== current) return;
    clearTimeout(sceneLoadTimeout);
    assetStatus.hidden = true;
    target.disabled = false;
    current.tail = imageFor(cat.tail, "low");
    imageFor(hands.open.image);
    imageFor(hands.curled.image, "low");
    fitCat();
  };

  if (ready(body)) {
    showCat();
  } else if (body.complete) {
    showFailure("猫咪图片加载失败");
  } else {
    body.addEventListener("load", showCat, { once: true });
    body.addEventListener("error", () => showFailure("猫咪图片加载失败"), { once: true });
    sceneLoadTimeout = setTimeout(() => showFailure("场景加载较慢"), SCENE_TIMEOUT_MS);
  }
}

function readSelection(kind, items) {
  try {
    const id = localStorage.getItem("cat-nap-" + kind);
    return items.find((item) => item.id === id) ?? items[0];
  } catch {
    return items[0];
  }
}

function saveSelection(kind, item) {
  try {
    localStorage.setItem("cat-nap-" + kind, item.id);
  } catch {
  }
  selectionStatus.textContent = "已选择" + item.name;
}

function mountOptions(container, items, selected, choose) {
  for (const item of items) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";
    button.title = item.name;
    button.setAttribute("aria-label", item.name);
    button.setAttribute("aria-pressed", String(item === selected));

    const thumbnail = document.createElement("img");
    thumbnail.alt = "";
    thumbnail.decoding = "async";
    thumbnail.src = item.thumbnail ?? item.body ?? backgroundImage(item);
    button.append(thumbnail);

    button.addEventListener("click", () => {
      if (button.getAttribute("aria-pressed") === "true") return;
      container.querySelector('[aria-pressed="true"]')?.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-pressed", "true");
      choose(item);
    });
    container.append(button);
  }
}

mountOptions(document.querySelector("#cats"), cats, cat, (item) => {
  stopPetting();
  cat = item;
  art = loadCat(cat);
  geometry = catGeometry(cat, art, bodySize);
  pose.tailOpen = 0;
  pose.tailBend = 0;
  pose.tailFlex = 0;
  pose.tailPressure = 0;
  tailRecovery = null;
  tailDisplacement = null;
  spine = tailSpine(geometry, pose);
  saveSelection("cat", cat);
  watchSceneAssets();
});

mountOptions(document.querySelector("#backgrounds"), backgrounds, background, (item) => {
  background = item;
  imageFor(backgroundImage(background));
  saveSelection("background", background);
});

sizeControl.addEventListener("input", () => {
  if (gesture || keyboard || pointerId !== null) stopPetting();
  bodySize = sizeControl.valueAsNumber / 100;
  geometry = catGeometry(cat, art, bodySize);
});

catScaleControl.addEventListener("input", () => {
  if (gesture || keyboard || pointerId !== null) stopPetting();
  fitCat();
});

assetRetry.addEventListener("click", () => {
  art = loadCat(cat, true);
  watchSceneAssets();
});
imageFor(backgroundImage(background));
assetStatus.dataset.appReady = "true";
watchSceneAssets();

function fitStage() {
  const bounds = scene.getBoundingClientRect();
  view.width = bounds.width;
  view.height = bounds.height;
  view.mobile = mobileLayout.matches;
  if (view.mobile && !gesture && !keyboard) hand.visible = false;
  view.pixelRatio = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(view.width * view.pixelRatio));
  canvas.height = Math.max(1, Math.round(view.height * view.pixelRatio));

  const cover = Math.max(view.width / WIDTH, view.height / HEIGHT);
  view.scale = (view.mobile
    ? Math.min(view.width / 1260, view.height / HEIGHT)
    : Math.min(cover, view.width / 1080, view.height / 495)) || 1;
  view.x = (view.width - WIDTH * view.scale) / 2;
  view.y = (view.height - HEIGHT * view.scale) / 2;
  if (view.mobile) view.y += view.height * 0.06;
  fitCat();
}

function fitCat() {
  if (!view.width || !view.height) return;

  const full = catGeometry(cat, art, 1);
  const furMargin = 24;
  const tailSwing = full.tailLength * 0.78;
  const left = full.bodyX - furMargin;
  const right = Math.max(full.bodyX + full.bodyWidth, full.rootX + full.tailLength) + furMargin;
  const top = Math.min(full.bodyY, full.rootY - tailSwing) - furMargin;
  const bottom = Math.max(full.bodyY + full.bodyHeight, full.rootY + tailSwing) + furMargin;
  const pivotX = (left + right) / 2;
  const pivotY = (top + bottom) / 2;
  const screenX = view.x + pivotX * view.scale;
  const screenY = view.y + pivotY * view.scale;
  const inset = 4;
  const fittingScale = Math.min(
    (screenX - inset) / (pivotX - left),
    (view.width - screenX - inset) / (right - pivotX),
    (screenY - inset) / (pivotY - top),
    (view.height - screenY - inset) / (bottom - pivotY),
  );
  const max = Math.max(Number(catScaleControl.min),
    Math.min(maximumCatScale, Math.floor(fittingScale / view.scale * 100)));
  if (Number(catScaleControl.max) !== max) catScaleControl.max = String(max);

  view.catScale = view.scale * catScaleControl.valueAsNumber / 100;
  view.catX = screenX - pivotX * view.catScale;
  view.catY = screenY - pivotY * view.catScale;
}

new ResizeObserver(fitStage).observe(scene);
fitStage();

function drawBackground() {
  const image = imageFor(backgroundImage(background));
  if (ready(image)) {
    const scale = Math.max(view.width / image.naturalWidth, view.height / image.naturalHeight);
    const width = image.naturalWidth * scale;
    const height = image.naturalHeight * scale;
    context.drawImage(image, (view.width - width) / 2, (view.height - height) / 2, width, height);
  } else {
    context.fillStyle = background.color;
    context.fillRect(0, 0, view.width, view.height);
  }
}

let handBlendCanvas;
let handBlendContext;

function drawHandSprite(ink, config, placement, opacity = 1) {
  const image = imageFor(config.image);
  if (!ready(image) || opacity < 0.01) return;

  const { width, x: handX, y: handY, bottom } = placement;
  const height = width * image.naturalHeight / image.naturalWidth;
  const x = -width * config.anchorX;
  const y = -height * config.anchorY;
  const sleeveStart = Math.round(image.naturalHeight * (view.mobile ? 0.64 : 0.77));
  const sleeveY = y + height * sleeveStart / image.naturalHeight;
  const fabricCenter = width * (0.7 - config.anchorX);
  const fabricTilt = fabricCenter * Math.sin(hand.tilt);
  const bottomGap = view.mobile
    ? Math.min(96, (bottom + 12 - handY - fabricTilt) / Math.cos(hand.tilt) - y - height)
    : bottom + 40 - handY - y - height;
  const extra = Math.max(0, bottomGap);

  ink.save();
  ink.translate(handX, handY);
  ink.rotate(hand.tilt);
  ink.globalAlpha = opacity;

  if (extra > 0) {
    ink.drawImage(image, 0, sleeveStart, image.naturalWidth, image.naturalHeight - sleeveStart,
      x, sleeveY - 0.5, width, y + height - sleeveY + extra + 0.5);
    ink.drawImage(image, 0, 0, image.naturalWidth, sleeveStart,
      x, y, width, sleeveY - y);
  } else {
    ink.drawImage(image, x, y, width, height);
  }
  ink.restore();
}

function drawHand() {
  if (hand.visible === false || !ready(art.body) || !ready(imageFor(hands.open.image))) return;
  const entry = view.mobile ? hand.entry ?? 1 : 1;
  if (entry <= 0) return;

  const width = view.mobile ? 232 : 167;
  const bottom = (view.height - view.y) / view.scale;
  const startY = bottom + width * 0.42;
  const handX = (view.catX + hand.x * view.catScale - view.x) / view.scale;
  const handY = (view.catY + hand.y * view.catScale - view.y) / view.scale;
  const placement = { width, bottom, x: handX, y: startY + (handY - startY) * entry };
  const grip = ready(imageFor(hands.curled.image)) ? hand.grip : 0;
  const radius = 64 - grip * 19;
  const shadowX = 23 - grip * 17;
  const shadowY = 35 - grip * 26;
  const shadowScale = width / 167;
  context.save();
  context.translate(placement.x, placement.y);
  context.rotate(hand.tilt);
  context.scale(shadowScale, shadowScale * (0.68 - grip * 0.19));
  const shadow = context.createRadialGradient(shadowX, shadowY, 7, shadowX, shadowY, radius);
  shadow.addColorStop(0, `rgba(50, 30, 19, ${0.32 * entry * entry})`);
  shadow.addColorStop(1, "rgba(50, 30, 19, 0)");
  context.fillStyle = shadow;
  context.fillRect(shadowX - radius, shadowY - radius, radius * 2, radius * 2);
  context.restore();

  if (grip < 0.015 || grip > 0.985) {
    drawHandSprite(context, grip < 0.015 ? hands.open : hands.curled, placement);
    return;
  }

  if (!handBlendCanvas) {
    handBlendCanvas = document.createElement("canvas");
    handBlendContext = handBlendCanvas.getContext("2d");
  }
  if (handBlendCanvas.width !== canvas.width) handBlendCanvas.width = canvas.width;
  if (handBlendCanvas.height !== canvas.height) handBlendCanvas.height = canvas.height;

  const ink = handBlendContext;
  ink.resetTransform();
  ink.clearRect(0, 0, handBlendCanvas.width, handBlendCanvas.height);
  const scale = view.pixelRatio * view.scale;
  ink.setTransform(scale, 0, 0, scale, view.pixelRatio * view.x, view.pixelRatio * view.y);
  ink.globalCompositeOperation = "source-over";
  drawHandSprite(ink, hands.open, placement, 1 - grip);
  ink.globalCompositeOperation = "lighter";
  drawHandSprite(ink, hands.curled, placement, grip);

  context.save();
  context.resetTransform();
  context.drawImage(handBlendCanvas, 0, 0);
  context.restore();
}

function approach(current, goal, rate, seconds) {
  return goal + (current - goal) * Math.exp(-rate * seconds);
}

function smoothstep(value) {
  const fraction = Math.max(0, Math.min(1, value));
  return fraction * fraction * (3 - 2 * fraction);
}

function tailBounds() {
  const inset = 4;
  return {
    left: (inset - view.catX) / view.catScale,
    right: (view.width - inset - view.catX) / view.catScale,
    top: (inset - view.catY) / view.catScale,
    bottom: (view.height - inset - view.catY) / view.catScale,
  };
}

function tailAngleOffset(angle, from) {
  return Math.atan2(Math.sin(angle - from), Math.cos(angle - from));
}

function beginTailStroke(x, y, now, pressed, keepProgress = false) {
  const { progress } = tailSurfacePoint(x, y, spine);
  const point = tailPointAt(spine, progress);
  const startingBend = tailRecovery && tailJointAngles(spine).map((angle, index) =>
    tailAngleOffset(angle, tailRecovery.rest[index]));
  tailRecovery = null;
  if (!keepProgress) pose.tailProgress = progress;
  return {
    zone: "tail", x, y, dx: 0, dy: 0, movedAt: pressed ? now : -Infinity,
    startX: x, startY: y, offsetX: x - point.x, offsetY: y - point.y,
    startProgress: progress, progress, furthestX: x,
    startOpen: pose.tailOpen, startBend: pose.tailBend,
    open: pose.tailOpen, bend: pose.tailBend, flex: 0, slip: false,
    startingBend, keptBend: 1, lateralSpeed: 0,
  };
}

function tailStrokePose(stroke, settings) {
  if (!stroke.startingBend || stroke.keptBend <= 0) return settings;
  const angles = tailJointAngles(tailSpine(geometry, settings));
  return {
    ...settings,
    tailAngles: angles.map((angle, index) => angle + stroke.startingBend[index] * stroke.keptBend),
    tailBounds: tailBounds(),
  };
}

function beyondTailTip(x, y, points) {
  const tip = tailPointAt(points, 1);
  const dx = x - tip.x;
  const dy = y - tip.y;
  const along = dx * Math.cos(tip.angle) + dy * Math.sin(tip.angle);
  const across = dy * Math.cos(tip.angle) - dx * Math.sin(tip.angle);
  return along > 8 && Math.abs(across) < geometry.tailWidth * 0.45;
}

function advanceTailStroke(stroke, x, y, now, followFinger = false) {
  const dx = x - stroke.x;
  const dy = y - stroke.y;
  const step = Math.hypot(dx, dy);
  if (step < 0.25) return true;

  const length = geometry.tailLength;
  const travel = Math.hypot(x - stroke.startX, y - stroke.startY);
  const offset = Math.max(0, 1 - travel / (length * 0.12));
  const fingerX = x - stroke.offsetX * offset;
  const fingerY = y - stroke.offsetY * offset;
  const { angle } = tailPointAt(spine, stroke.progress);
  const across = dy * Math.cos(angle) - dx * Math.sin(angle);
  const along = dx * Math.cos(angle) + dy * Math.sin(angle);
  const acrossTail = Math.abs(across) > Math.abs(along) * 0.72;
  if (stroke.startingBend) stroke.keptBend = Math.min(stroke.keptBend, 1 - smoothstep(travel / (length * 0.45)));

  if (x > stroke.furthestX) {
    stroke.furthestX = x;
    const pull = Math.max(0, x - stroke.startX - length * 0.014);
    const span = length * (0.17 + (1 - stroke.startProgress) * 0.19);
    const progress = Math.min(1, pull / span);
    const opening = smoothstep(progress);
    stroke.open = stroke.startOpen + (1 - stroke.startOpen) * opening;
    const yaw = Math.atan2(y - stroke.startY, Math.max(length * 0.17, pull));
    const bend = Math.max(-0.56, Math.min(0.54, yaw));
    stroke.bend = stroke.startBend + (bend - stroke.startBend) * opening;
  }

  const width = geometry.tailWidth;
  const search = Math.min(0.44, 0.11 + step / length * 2);
  const start = Math.max(0, stroke.progress - search);
  const end = Math.min(1, stroke.progress + search);
  const drawn = tailSurfacePoint(fingerX, fingerY, spine, start, end);
  const goalSpine = tailSpine(geometry, tailStrokePose(stroke, { tailOpen: stroke.open, tailBend: stroke.bend }));
  const ahead = tailSurfacePoint(fingerX, fingerY, goalSpine, start, end);
  const onDrawnTail = drawn.distance <= width * 0.47;
  const contact = onDrawnTail ? drawn : ahead;
  const nearTip = Math.max(stroke.progress, drawn.progress, ahead.progress) > 0.94;
  stroke.slip = nearTip && beyondTailTip(fingerX, fingerY, goalSpine);
  const edgeGap = Math.min(tailEdgeDistance(geometry, drawn), tailEdgeDistance(geometry, ahead));
  const outsideReach = followFinger && touchStartedAt !== null
    ? edgeGap * view.catScale > TAIL_RELEASE_PX
    : Math.min(drawn.distance, contact.distance) > width * (followFinger ? 0.9 : 0.57);
  if (!stroke.slip && outsideReach) return false;

  const steering = followFinger && !stroke.slip && (stroke.target || (acrossTail && drawn.distance > 4));
  stroke.target = steering ? { x: fingerX, y: fingerY } : null;
  stroke.flex = steering ? 0 : Math.max(-0.14, Math.min(0.14, across / 42));
  if (stroke.slip) stroke.progress = 1;
  else if (!steering || !acrossTail) stroke.progress = contact.progress;
  stroke.x = x;
  stroke.y = y;
  stroke.dx = dx;
  stroke.dy = dy;
  const delta = now - stroke.movedAt;
  stroke.lateralSpeed = delta < 100 ? across * view.catScale * 1000 / Math.max(8, delta) : 0;
  stroke.movedAt = now;
  return true;
}

function drawTailSpine(action, seconds, now) {
  if (!action) return recoverTail(now);

  const settings = tailStrokePose(action, pose);
  const base = tailSpine(geometry, settings);
  const target = action.target;
  if (!target && !tailDisplacement) return base;

  const progress = pose.tailProgress;
  const point = tailPointAt(base, progress);
  const goal = target ? tailPointAt(base, action.progress) : point;
  const dx = target ? target.x - goal.x : 0;
  const dy = target ? target.y - goal.y : 0;
  const limit = Math.max(1, Math.hypot(dx, dy) / (geometry.tailWidth * 1.5));
  const rate = target ? 44 : 14;
  const x = approach(tailDisplacement?.x ?? 0, dx / limit, rate, seconds);
  const y = approach(tailDisplacement?.y ?? 0, dy / limit, rate, seconds);
  if (!target && Math.hypot(x, y) < 0.25) {
    tailDisplacement = null;
    return base;
  }

  tailDisplacement = { x, y };
  return tailSpine(geometry, {
    ...settings,
    tailTarget: { x: point.x + x, y: point.y + y, progress, bounds: tailBounds() },
  });
}

function releaseTail(now, stroke = gesture?.zone === "tail" ? gesture : keyboard?.stroke) {
  if (tailRecovery) return;

  const reduced = reducedMotion.matches;
  const lateralSpeed = stroke && now - stroke.movedAt < 120 ? stroke.lateralSpeed : 0;
  tailRecovery = {
    angles: tailJointAngles(spine),
    rest: tailJointAngles(tailSpine(geometry)),
    start: now + (reduced ? 180 : TAIL_RELEASE_PAUSE),
    duration: reduced ? 650 : TAIL_RECOVERY_MS,
    sway: reduced ? 0 : 0.085 * Math.sign(lateralSpeed) * smoothstep((Math.abs(lateralSpeed) - 90) / 400),
    pressure: pose.tailPressure,
    progress: pose.tailProgress,
  };
  pose.tailOpen = 0;
  pose.tailBend = 0;
  pose.tailFlex = 0;
  tailDisplacement = null;
}

function recoverTail(now) {
  if (!tailRecovery) return tailSpine(geometry, pose);

  const { angles, rest, start, duration, sway, pressure, progress } = tailRecovery;
  const elapsed = (now - start) / duration;
  if (elapsed >= 1) {
    tailRecovery = null;
    return tailSpine(geometry, pose);
  }

  const flick = elapsed > 0.58 ? Math.sin(Math.PI * smoothstep((elapsed - 0.58) / 0.42)) * sway : 0;
  const recoveringAngles = angles.map((angle, index) => {
    const position = index / (angles.length - 1);
    const delay = 0.16 * position ** 1.5;
    const blend = smoothstep((elapsed - delay) / (0.84));
    return angle + tailAngleOffset(rest[index], angle) * blend + flick * position ** 3;
  });
  return tailSpine(geometry, {
    ...pose,
    tailAngles: recoveringAngles,
    tailBounds: tailBounds(),
    tailPressure: pressure * (1 - smoothstep(elapsed)),
    tailProgress: progress,
  });
}

function keyboardContact(now) {
  if (!keyboard) return null;
  const progress = (now - keyboard.start) / keyboard.duration;
  if (progress >= 1) {
    if (keyboard.zone === "tail") releaseTail(now);
    keyboard = null;
    return null;
  }
  const curve = Math.sin(progress * Math.PI);
  if (keyboard.zone === "tail") {
    const stroke = keyboard.stroke;
    const sweep = progress * progress * (3 - 2 * progress);
    const x = stroke.startX + (geometry.rootX + geometry.tailLength * 1.06 - stroke.startX) * sweep;
    const y = stroke.startY - geometry.tailLength * 0.25 * sweep;
    if (advanceTailStroke(stroke, x, y, now)) return stroke;
    releaseTail(now);
    keyboard = null;
    return null;
  }
  const shoulder = geometry.headX + (geometry.backX - geometry.headX) * 0.36;
  return {
    zone: "back",
    x: shoulder + (geometry.backX - shoulder) * progress,
    y: geometry.backY - 16 * curve,
    movedAt: now,
    dx: 3,
    dy: 0,
  };
}

function moveTouchContact(x, y, seconds, direct = false) {
  const distance = Math.hypot(x - pose.contactX, y - pose.contactY);
  const ease = 1 - Math.exp(-(direct ? 105 : 54) * seconds);
  const limit = TOUCH_TRANSITION_SPEED * seconds / Math.max(1, distance);
  const amount = direct ? ease : Math.min(ease, limit);
  pose.contactX += (x - pose.contactX) * amount;
  pose.contactY += (y - pose.contactY) * amount;
}

function updateBodyPressure(action, followingTail, touching, moving, motionScale, seconds) {
  const zone = followingTail ? null : action?.zone;
  let pressure = 0;
  if (zone === "head" || zone === "back") {
    pose.bodyContactX = pose.contactX;
    pose.bodyContactY = pose.contactY;
    const speed = Math.hypot(pose.contactX - hand.x, pose.contactY - hand.y) / Math.max(seconds, 0.008);
    const stroke = moving ? 0.62 + 0.38 * Math.min(1, speed / 1300) : 0;
    const held = pointerId !== null ? 0.46 : 0;
    const landed = touching ? Math.max(0, (hand.entry - 0.65) / 0.35) : 1;
    pressure = Math.max(stroke, held) * landed * motionScale;
  }
  const head = zone === "head" ? pressure : 0;
  const back = zone === "back" ? pressure : 0;
  pose.head = approach(pose.head, head, head > pose.head ? 25 : 9, seconds);
  pose.back = approach(pose.back, back, back > pose.back ? 25 : 9, seconds);
}

function restHandOnTail(x, y, pressed = false) {
  if (pressed) {
    pose.tailProgress = tailSurfacePoint(x, y, spine, TAIL_HAND_START).progress;
    touchTailJoined = true;
  }
  return { zone: "tail-nearby", x, y, movedAt: -Infinity };
}

function render(now) {
  animation = 0;
  const seconds = Math.min(0.05, (now - (previousTime || now - 16)) / 1000);
  previousTime = now;
  geometry = catGeometry(cat, art, bodySize);

  const motionScale = reducedMotion.matches ? 0.52 : 1;
  if (gesture?.zone === "tail-tip" && tailRecovery && now - tailRecovery.start > 110) {
    gesture = restHandOnTail(gesture.x, gesture.y);
  }
  let action = keyboardContact(now) ?? gesture;
  let tailHeld = action?.zone === "tail";
  const touching = touchStartedAt !== null;
  const atTip = action?.zone === "tail-tip";
  const tailNearby = action?.zone === "tail-nearby";
  const followingTail = tailHeld || atTip || tailNearby || (touching && touchTailJoined);
  if (followingTail) {
    const joinedGrip = tailHeld && (!touching || touchTailJoined);
    const nearby = tailNearby ? tailSurfacePoint(action.x, action.y, spine, TAIL_HAND_START).progress : 0;
    const progress = approach(pose.tailProgress, tailHeld ? action.progress : atTip ? 1 : nearby, joinedGrip ? 72 : 38, seconds);
    const maxStep = TOUCH_TRANSITION_SPEED * seconds / geometry.tailLength;
    pose.tailProgress = touching && !joinedGrip
      ? pose.tailProgress + Math.max(-maxStep, Math.min(maxStep, progress - pose.tailProgress))
      : progress;
  }
  if (tailHeld) {
    pose.tailOpen = approach(pose.tailOpen, action.open, 19, seconds);
    pose.tailBend = approach(pose.tailBend, action.bend, 14, seconds);
  }
  const activeFlex = tailHeld && now - action.movedAt < 120 ? action.flex : 0;
  pose.tailFlex = approach(pose.tailFlex, activeFlex * motionScale, 12, seconds);
  pose.tailPressure = approach(pose.tailPressure, tailHeld ? motionScale : 0, 17, seconds);
  spine = drawTailSpine(tailHeld ? action : null, seconds, now);

  let handTilt = 0;
  if (followingTail) {
    directBodyFollow = false;
    const contact = tailPointAt(spine, pose.tailProgress);
    if (!touching || touchTailJoined) {
      pose.contactX = contact.x;
      pose.contactY = contact.y;
    } else {
      moveTouchContact(contact.x, contact.y, seconds);
      touchTailJoined = Math.hypot(contact.x - pose.contactX, contact.y - pose.contactY) < 3;
    }
    if (!tailHeld && !atTip && pose.tailProgress < 0.025) touchTailJoined = false;
    handTilt = Math.sin(contact.angle) * 0.25;

    if (tailHeld && action.slip && pose.tailProgress > 0.978 && beyondTailTip(action.x, action.y, spine)) {
      releaseTail(now, action);
      passedTail = keyboard ? null : { x: action.x, y: action.y };
      gesture = touching ? { ...action, zone: "tail-tip", movedAt: -Infinity } : null;
      keyboard = null;
      action = gesture;
      tailHeld = false;
      if (!touching) target.classList.remove("is-following");
    }
  } else if (touching && action?.contact) {
    const goal = action.contact;
    const onFur = goal.x === action.x && goal.y === action.y;
    moveTouchContact(goal.x, goal.y, seconds, directBodyFollow && onFur);
    const contact = closestBodyContact(pose.contactX, pose.contactY, geometry, art.body);
    pose.contactX = contact.x;
    pose.contactY = contact.y;
    directBodyFollow = onFur && (directBodyFollow || Math.hypot(goal.x - contact.x, goal.y - contact.y) < 12);
  } else {
    directBodyFollow = false;
    const contactRate = action ? 95 : 6;
    pose.contactX = approach(pose.contactX, action?.x ?? geometry.backX, contactRate, seconds);
    pose.contactY = approach(pose.contactY, action?.y ?? geometry.backY, contactRate, seconds);
  }

  const moving = action && now - action.movedAt < 200;
  const motionLength = moving ? Math.max(1, Math.hypot(action.dx, action.dy)) : 1;
  pose.strokeX = approach(pose.strokeX, moving ? action.dx / motionLength : 0, 20, seconds);
  pose.strokeY = approach(pose.strokeY, moving ? action.dy / motionLength : 0, 20, seconds);
  const entry = touching && !reducedMotion.matches
    ? Math.max(0, Math.min(1, (now - touchStartedAt) / TOUCH_ENTRY_MS))
    : 1;
  hand.entry = 1 - (1 - entry) ** 2;
  updateBodyPressure(action, followingTail, touching, moving, motionScale, seconds);
  hand.x = pose.contactX;
  hand.y = pose.contactY;
  hand.visible = !view.mobile || Boolean(action);
  hand.grip = approach(hand.grip, tailHeld && (!touching || touchTailJoined) ? 1 : 0, 28, seconds);
  const tiltLimit = followingTail ? 0.32 : 0.13;
  const tilt = Math.max(-tiltLimit, Math.min(tiltLimit, (hand.x - geometry.backX) / 2400 + handTilt));
  hand.tilt = approach(hand.tilt, tilt, 15, seconds);

  const nextIntensity = moving ? (tailHeld ? 0.48 : 0.74) : 0;
  if (nextIntensity !== intensity) {
    intensity = nextIntensity;
    purr.setIntensity(intensity);
  }

  if (view.width && view.height) {
    context.setTransform(view.pixelRatio, 0, 0, view.pixelRatio, 0, 0);
    drawBackground();
    context.save();
    context.translate(view.catX, view.catY);
    context.scale(view.catScale, view.catScale);
    drawCat(context, pose, cat, art, spine, geometry);
    context.restore();
    context.translate(view.x, view.y);
    context.scale(view.scale, view.scale);
    drawHand();
  }

  if (!document.hidden) animation = requestAnimationFrame(render);
}

function scenePoint(event) {
  const bounds = scene.getBoundingClientRect();
  return {
    x: (event.clientX - bounds.left - view.catX) / view.catScale,
    y: (event.clientY - bounds.top - view.catY) / view.catScale,
  };
}

function pettingZone(x, y, touching) {
  const zone = hitCat(x, y, pose, cat, art, spine, geometry);
  if (zone === "tail" || zone === "head" || !ready(art.body) || !ready(art.tail) || x <= geometry.rootX) return zone;

  const nearby = tailSurfacePoint(x, y, spine);
  const onBack = zone === "back";
  const reach = onBack ? (touching ? 10 : 2) : (touching ? TAIL_PICKUP_PX : 7);
  if (nearby.progress <= (onBack ? 0.10 : 0.08) || tailEdgeDistance(geometry, nearby) * view.catScale > reach) return zone;
  return "tail";
}

function updatePointer(event, pressed = false) {
  const { x, y } = scenePoint(event);
  const touching = touchStartedAt !== null;
  const tipReach = (touching ? TAIL_RELEASE_PX : 26) / view.catScale;
  let zone = pettingZone(x, y, touching);
  const now = performance.now();

  if (keyboard?.zone === "tail") releaseTail(now);
  keyboard = null;
  if (gesture?.zone === "tail") {
    const returningToBody = zone === "head" || (zone === "back" && x <= geometry.rootX);
    const withinReach = zone === "tail" || Math.hypot(x - geometry.rootX, y - geometry.rootY) <= geometry.tailLength + tipReach;
    if (!returningToBody && withinReach && advanceTailStroke(gesture, x, y, now, true)) {
      target.classList.toggle("is-following", ready(imageFor(hands.open.image)));
      return;
    }
    releaseTail(now, gesture);
    gesture = null;
  }

  if (passedTail) {
    const tip = tailPointAt(spine, 1);
    const distance = Math.hypot(x - tip.x, y - tip.y);
    const previousDistance = Math.hypot(passedTail.x - tip.x, passedTail.y - tip.y);
    const continuing = distance + 0.5 >= previousDistance;
    const nearTip = zone === "tail" && tailSurfacePoint(x, y, spine).progress > 0.9;
    if (continuing && nearTip) zone = null;
    else if (zone || distance > tipReach) passedTail = null;
  }

  if (zone === "tail") {
    gesture = beginTailStroke(x, y, now, pressed, touching && touchTailJoined && !pressed);
    if (touching && pressed) touchTailJoined = true;
    target.classList.toggle("is-following", ready(imageFor(hands.open.image)));
    return;
  }

  if (gesture?.zone === "tail-tip") {
    const tip = tailPointAt(spine, 1);
    if (!zone && Math.hypot(x - tip.x, y - tip.y) < tipReach) return;
  }
  if (!zone && !touching) {
    gesture = null;
    target.classList.remove("is-following");
    return;
  }
  if (!zone && x >= geometry.rootX && ready(art.tail)) {
    gesture = restHandOnTail(x, y, pressed);
    target.classList.toggle("is-following", ready(imageFor(hands.open.image)));
    return;
  }

  const contact = touching ? closestBodyContact(x, y, geometry, art.body) : null;
  if (contact && pressed) {
    pose.contactX = contact.x;
    pose.contactY = contact.y;
  }
  const dx = gesture ? x - gesture.x : 0;
  const dy = gesture ? y - gesture.y : 0;
  const moved = pressed || (gesture && Math.hypot(dx, dy) > 0.25);

  gesture = {
    zone: contact?.zone ?? zone, x, y, dx, dy, contact,
    movedAt: moved ? now : gesture?.movedAt ?? now,
  };

  target.classList.toggle("is-following", ready(imageFor(hands.open.image)));
}

function stopPetting() {
  const captured = pointerId;
  pointerId = null;
  if (captured !== null && target.hasPointerCapture(captured)) {
    target.releasePointerCapture(captured);
  }

  if (gesture?.zone === "tail" || keyboard?.zone === "tail") {
    releaseTail(performance.now());
  }
  touchStartedAt = null;
  touchTailJoined = false;
  directBodyFollow = false;
  if (view.mobile) hand.visible = false;
  passedTail = null;
  keyboard = null;
  gesture = null;
  intensity = 0;
  target.classList.remove("is-following");
  purr.stop();
}

target.addEventListener("pointerdown", (event) => {
  if (target.disabled || !event.isPrimary || event.button !== 0 || pointerId !== null) return;
  void purr.unlock();
  pointerId = event.pointerId;
  if (event.pointerType === "touch") {
    touchStartedAt = performance.now();
    touchTailJoined = false;
    hand.grip = 0;
    hand.tilt = 0;
  }
  target.setPointerCapture(pointerId);
  updatePointer(event, true);
});

target.addEventListener("pointermove", (event) => {
  if (target.disabled || !event.isPrimary || (pointerId !== null && event.pointerId !== pointerId)) return;
  if (event.pointerType === "touch" && pointerId === null) return;
  updatePointer(event);
});

target.addEventListener("pointerup", (event) => {
  if (event.pointerId !== pointerId) return;
  void purr.unlock();
  stopPetting();
});

target.addEventListener("pointercancel", (event) => {
  if (event.pointerId === pointerId) stopPetting();
});
target.addEventListener("lostpointercapture", (event) => {
  if (event.pointerId === pointerId) stopPetting();
});
target.addEventListener("pointerleave", (event) => {
  if (pointerId === null && event.pointerType !== "touch") stopPetting();
});

function keyboardPet(zone) {
  if (target.disabled || pointerId !== null || (zone === "tail" && !ready(art.tail))) return;
  void purr.unlock();
  if (gesture?.zone === "tail" || keyboard?.zone === "tail") releaseTail(performance.now());
  gesture = null;
  passedTail = null;
  target.classList.remove("is-following");
  const now = performance.now();
  keyboard = { zone, start: now, duration: zone === "tail" ? 1240 : 620 };
  if (zone === "tail") {
    const start = tailPointAt(spine, 0.23);
    keyboard.stroke = beginTailStroke(start.x, start.y, now, true);
  }
}

target.addEventListener("click", (event) => {
  if (event.detail === 0 && event.pointerType !== "touch") keyboardPet("back");
});

document.addEventListener("keydown", (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;

  const inScene = event.target === document.body || event.target === target;
  if (event.code === "Space" && inScene) {
    event.preventDefault();
    keyboardPet("back");
  } else if (event.code === "KeyT" && event.target !== sizeControl && event.target !== catScaleControl
    && (inScene || viewer.contains(event.target))) {
    event.preventDefault();
    keyboardPet("tail");
  }
});

window.addEventListener("blur", stopPetting);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopPetting();
    cancelAnimationFrame(animation);
    animation = 0;
  } else if (!animation) {
    previousTime = 0;
    animation = requestAnimationFrame(render);
  }
});

if (!document.hidden) animation = requestAnimationFrame(render);

});
</script>
</body>
</html>
